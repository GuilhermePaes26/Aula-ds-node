<!-- cadastro.html -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Cliente</title>
</head>
<body>
    <h1>Cadastro de Cliente</h1>
    <form action="/cadastro" method="POST">
        <label for="nm_clie">Nome:</label>
        <input type="text" id="nm_clie" name="nm_clie" required><br>

        <label for="cpf_clie">CPF:</label>
        <input type="text" id="cpf_clie" name="cpf_clie" required><br>

        <label for="senha_clie">Senha:</label>
        <input type="password" id="senha_clie" name="senha_clie" required><br>

        <button type="submit">Cadastrar</button>
    </form>
</body>
</html>
